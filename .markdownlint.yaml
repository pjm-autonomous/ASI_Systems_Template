# markdownlint-cli2 configuration
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md

default: true

# Long lines are fine — tables and frontmatter-adjacent prose routinely exceed 80 chars.
MD013: false

# Allow inline HTML — Mermaid fences and occasional <br> in tables are legitimate.
MD033: false

# Allow duplicate heading text across different files (e.g. every ADR has a "## Status" heading).
MD024:
  siblings_only: true

# First line doesn't have to be a top-level heading — frontmatter comes first.
MD041: false

# Repo table convention is padded content rows with compact delimiter rows
# (`| Field | Value |` over `|---|---|`), used consistently across templates
# and artifacts. MD060 (added in markdownlint v0.40) flags that mix; keep the
# established style instead.
MD060: false
