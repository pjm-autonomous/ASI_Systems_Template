name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Validate artifacts
        # --require-parents makes cross-repo parent references a hard gate here.
        # Locally an unreachable parent degrades to a shape-only check so an
        # offline commit still works; in CI it must resolve.
        run: validate-artifacts --require-parents
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Traceability matrix is current
        # Answers a different question from validate-artifacts: not "do the
        # references resolve" but "is the tracked matrix still what the
        # generator would emit". A stale matrix passes every other check.
        run: build-traceability --check

      - name: Run tests
        run: pytest

  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: "**/*.md"
