name: Documentation issue
description: README / CLAUDE / CONTRIBUTING / reference docs are wrong, missing, or unclear.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: file
    attributes:
      label: File path
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What's wrong or missing
    validations:
      required: true
