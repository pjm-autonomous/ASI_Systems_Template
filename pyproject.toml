[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sa-se-template-tools"
version = "0.1.0"
description = "Validation tooling for the SA/SE project template artifact tree."
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
validate-artifacts = "tools.validate:main"

[tool.setuptools]
packages = ["tools"]
